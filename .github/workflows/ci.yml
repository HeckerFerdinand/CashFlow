name: CI

# Pushes to master and pull requests (each change is tested once; a push to a
# branch with an open pull request is covered by the pull_request event).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: System libraries for Slint
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Start local Supabase stand-in (Postgres + PostgREST)
        run: scripts/dev-db.sh start
      - name: Tests (incl. integration tests against supabase/schema.sql)
        run: |
          eval "$(scripts/dev-db.sh env)"
          cargo test --workspace
